[project]
name = "peertube-offline-sync"
version = "0.1.0"
description = "Download new PeerTube videos to a Nextcloud folder for offline playback, delete them once watched."
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
peertube-offline-sync = "pos.sync:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
